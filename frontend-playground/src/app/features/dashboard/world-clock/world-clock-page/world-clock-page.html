<div class="clock-shell">
  <!-- Solid top bar (normal flow — never overlaps the map) -->
  <header class="topbar">
    <span class="brand">
      <mat-icon>public</mat-icon>
      <span class="brand-text">World Clock</span>
    </span>
    <span class="spacer"></span>

    @if (clock.syncing()) {
      <mat-icon class="sync-icon" aria-label="Syncing times">sync</mat-icon>
    }

    <button
      mat-icon-button
      class="toggle"
      [class.active]="showGrid()"
      (click)="toggleGrid()"
      [attr.aria-pressed]="showGrid()"
      [matTooltip]="showGrid() ? 'Hide timezone grid' : 'Show timezone grid'">
      <mat-icon>grid_on</mat-icon>
    </button>

    <button
      mat-icon-button
      class="toggle"
      [class.active]="showSearch()"
      (click)="toggleSearch()"
      [attr.aria-pressed]="showSearch()"
      [matTooltip]="showSearch() ? 'Hide search' : 'Show search'">
      <mat-icon>search</mat-icon>
    </button>

    @if (isAuthenticated()) {
      <button mat-stroked-button (click)="onProfile()">
        <mat-icon>account_circle</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-stroked-button (click)="onLogout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    } @else {
      <button mat-stroked-button (click)="onProfile()">
        <mat-icon>login</mat-icon>
        <span>Sign in</span>
      </button>
    }
  </header>

  <!-- Stage: the map fills this area beneath the bar; everything else floats over it -->
  <div class="stage">
    <!-- Map background (F1) -->
    <div class="map-layer">
      <app-world-map
        [selectedCodes]="selection.codes()"
        [showGrid]="showGrid()"
        [now]="clock.now()"
        (hover)="onHover($event)"
        (select)="onAdd($event)" />
    </div>

    <!-- Search + live list, floating over the map -->
    <section class="overlay" cdkDrag style="cursor: grab;">
      @if (showSearch()) {
        <app-search-bar (add)="onAdd($event)" />
      }

      @if (clock.error(); as err) {
        <div class="banner error" role="alert">
          <mat-icon>cloud_off</mat-icon>
          <span>{{ err }}</span>
        </div>
      }

      <app-clock-list
        [countries]="clock.countries()"
        [now]="clock.now()"
        (remove)="onRemove($event)" />
    </section>

    <!-- Hover detail panel (F5) -->
    @if (hovered(); as c) {
      <div class="detail-floating">
        <app-detail-panel [country]="c" [now]="clock.now()" />
      </div>
    }

    <!-- "Last information updated" (F6) -->
    <app-world-clock-footer [referenceUtc]="clock.referenceUtc()" />
  </div>
</div>
