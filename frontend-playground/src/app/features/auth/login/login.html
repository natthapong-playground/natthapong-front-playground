<div class="auth-shell" [class.light-theme]="uiTheme.isLight()">
  <button
    mat-icon-button
    type="button"
    class="theme-toggle"
    (click)="uiTheme.toggle()"
    [attr.aria-label]="uiTheme.isLight() ? 'Use ocean theme' : 'Use white theme'"
    [title]="uiTheme.isLight() ? 'Use ocean theme' : 'Use white theme'"
  >
    <mat-icon>{{ uiTheme.isLight() ? 'dark_mode' : 'light_mode' }}</mat-icon>
  </button>
  <mat-card class="auth-card" appearance="outlined">
    <mat-card-header class="auth-header">
      <div mat-card-avatar class="brand-avatar">
        <mat-icon>lock</mat-icon>
      </div>
      <mat-card-title>Sign in</mat-card-title>
      <mat-card-subtitle>Welcome, Please Login to continue.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="you@example.com"
          />
          <mat-icon matSuffix>mail</mat-icon>
          @if (getError('email'); as msg) {
            <mat-error>{{ msg }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            mat-icon-button
            matSuffix
            (click)="togglePassword()"
          >
            <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if (getError('password'); as msg) {
            <mat-error>{{ msg }}</mat-error>
          }
        </mat-form-field>

        @if (error(); as msg) {
          <div class="auth-error" role="alert">
            <mat-icon>error_outline</mat-icon>
            <span>{{ msg }}</span>
          </div>
        }

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="submit-btn"
          [disabled]="loading()"
        >
          @if (loading()) {
            <mat-progress-spinner mode="indeterminate" diameter="20"></mat-progress-spinner>
            <span>Signing in…</span>
          } @else {
            <span>Sign in</span>
          }
        </button>
      </form>
      <app-google-auth-button text="signin_with" />
    </mat-card-content>

    <mat-card-actions class="auth-footer">
      <span>Don't have an account?</span>
      <a mat-button color="primary" routerLink="/register">Create one</a>
    </mat-card-actions>
  </mat-card>
</div>
